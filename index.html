<!doctype html><html data-theme="light" style="color-scheme:light"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TBFlow · Nigeria community edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky prototype bar on top; app below. Desktop (>=860px): left sidebar + main column.
   Phone (<860px): top app bar, content, fixed bottom nav. Colour is used only for loop status. */
:root{
  --bg:#F4F4F4; --surface:#FFFFFF; --surface-2:#EBEBEB; --line:#D6D6D6; --ink:#1A1A1A; --mid:#5C5C5C; --faint:#8C8C8C;
  --on-ink:#FFFFFF; --focus:#1A1A1A; --scrim:rgba(16,16,16,.48); --proto:#1A1A1A; --on-proto:#EDEDED;
  --done:#1A1A1A; --done-bg:#E0E0E0; --due:#1A1A1A; --due-bg:#FFFFFF; --over:#FFFFFF; --over-bg:#1A1A1A;
  --block:#1A1A1A; --block-bg:#CFCFCF; --wait:#1A1A1A; --wait-bg:#F4F4F4; --not:#6B6B6B; --not-bg:#EFEFEF;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --r-s:6px;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--proto)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.5rem;font-weight:600} h2{font-size:1.125rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0} a{color:inherit}
.mono{font-family:var(--f-mono);font-size:.85em;font-variant-numeric:tabular-nums}
.muted{color:var(--mid)} .faint{color:var(--faint)} .small{font-size:.8125rem}
.label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- prototype bar ---------- */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--proto);color:var(--on-proto);
  display:flex;align-items:center;gap:10px;padding-block:8px;min-height:52px}
.pbar .brand{font-family:var(--f-head);font-weight:700;font-size:1rem;letter-spacing:-.01em;white-space:nowrap}
.pbar .tag{font-size:.65rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:1px 5px;opacity:.75}
.pbar .where{flex:1;min-width:34px;display:flex;gap:8px;align-items:baseline;overflow:hidden}
.pbar .where b{white-space:nowrap;flex:none;font-family:var(--f-mono);font-weight:500;font-size:.8rem;opacity:.8}
.pbar .where span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.875rem}
.pbtn{background:transparent;border:1px solid rgba(237,237,237,.28);color:var(--on-proto);border-radius:6px;padding:6px 10px;font-size:.8125rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pbtn:hover{background:rgba(237,237,237,.1)}
.pbar select{background:transparent;color:var(--on-proto);border:1px solid rgba(237,237,237,.28);border-radius:6px;padding:6px 8px;font:inherit;font-size:.8125rem;max-width:190px}
.pbar select option{color:#1A1A1A;background:#fff}
@media (max-width:640px){.pbar .tag,.pbar .rolepick-l,.pbar .hide-s{display:none}.pbar select{max-width:118px}}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 52px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.side .who{padding:4px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side .who b{display:block;font-size:.9rem}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:transparent;text-align:left;cursor:pointer;color:var(--mid);font-size:.9rem;width:100%}
.nav-i svg{width:18px;height:18px;flex:none}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
.nav-i .count{margin-left:auto;font-size:.75rem;font-weight:600;background:var(--ink);color:var(--on-ink);border-radius:10px;padding:0 7px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding-block:18px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .t{flex:1;min-width:0}
.topbar .t p{color:var(--mid);font-size:.85rem;margin-top:2px}
.iconbtn{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;position:relative;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--ink);border:2px solid var(--surface)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-weight:600;font-size:.8rem;border:0;cursor:pointer;flex:none}
.sync{font-size:.78rem;color:var(--mid);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink)}
.sync.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.content{padding-block:20px 40px;display:flex;flex-direction:column;gap:16px;max-width:1180px;width:100%}
.content.narrow{max-width:640px}
.bnav{display:none}
@media (max-width:859px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:20;padding-block:10px}
  .topbar h1{font-size:1.15rem}
  .topbar .sync{display:none}
  .content{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  .bnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:.7rem;color:var(--mid);cursor:pointer;min-width:0}
  .bnav button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .bnav button svg{width:22px;height:22px}
  .bnav button[aria-current="page"]{color:var(--ink);font-weight:600}
}

/* ---------- building blocks ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{border:0;padding:0;background:transparent}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.cols{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:10px 12px}.stat b{font-size:1.3rem}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-head);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.stat span{font-size:.8rem;color:var(--mid)}
.divider{height:1px;background:var(--line);border:0;margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:11px 18px;font-weight:600;font-size:.9rem;cursor:pointer;border:1px solid transparent;min-height:44px;text-decoration:none;text-align:center}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-primary:hover{opacity:.9}
.btn-secondary{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-quiet{background:var(--surface-2);color:var(--ink)}
.btn-link{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding-inline:4px;min-height:36px}
.btn-danger{background:var(--ink);color:var(--surface)}
.btn-sm{padding:6px 12px;min-height:34px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns.full .btn{flex:1 1 200px}
@media (max-width:859px){.btns.stick .btn{flex:1 1 100%}}

.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px 3px 8px;font-size:.75rem;font-weight:600;white-space:nowrap;line-height:1.4}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.p-done{color:var(--done);background:var(--done-bg)} .p-due{color:var(--due);background:var(--due-bg)}
.p-over{color:var(--over);background:var(--over-bg)} .p-block{color:var(--block);background:var(--block-bg)}
.p-wait{color:var(--wait);background:var(--wait-bg)} .p-not{color:var(--not);background:var(--not-bg)}
.p-due{box-shadow:inset 0 0 0 1.5px var(--ink)} .p-wait{box-shadow:none;outline:1.5px dashed var(--ink);outline-offset:-1.5px} .p-block{box-shadow:inset 0 0 0 2px var(--ink)} .p-not i{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.78rem;background:var(--surface);white-space:nowrap}
.owner{display:inline-flex;align-items:center;gap:6px;font-size:.82rem}
.owner i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-size:.62rem;font-weight:700}

.banner{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r);padding:14px 16px;border:1px solid var(--line);background:var(--surface-2)}
.banner > div:first-child{flex:1 1 260px;min-width:0}
.banner p{color:var(--mid);font-size:.88rem;margin-top:2px}
.banner .banner-acts{display:flex;gap:8px;flex-wrap:wrap}
.b-loop{border-left:4px solid var(--ink)}
.b-over{background:var(--surface);border:2px solid var(--ink);border-left-width:6px}
.b-over strong{color:var(--ink)}
.b-urgent{background:var(--surface);border:3px solid var(--ink)}
.b-urgent strong{color:var(--ink);text-transform:uppercase;letter-spacing:.02em}
.b-block{background:var(--surface-2);border:2px dashed var(--ink)}
.b-block strong{color:var(--block)}
.b-wait{background:var(--surface);border:1.5px dashed var(--ink)}
.b-done{background:var(--surface-2);border-color:transparent;border-left:4px solid var(--ink)}
.b-done strong{color:var(--done)}
.b-due{background:var(--surface);border:1.5px solid var(--ink);border-left-width:4px}
.b-due strong{color:var(--due)}
.b-offline{background:var(--due-bg);border-color:transparent}

.phead{display:flex;gap:14px;align-items:center}
.phead .av{width:48px;height:48px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;flex:none}
.phead h2{font-size:1.2rem}
.pcard{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface)}
.pcard b{display:block}
.kv{display:grid;grid-template-columns:minmax(120px,38%) minmax(0,1fr);gap:4px 14px;font-size:.9rem}
.kv dt{color:var(--mid)} .kv dd{margin:0;min-width:0}

/* tracker */
.trk{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600;font-family:var(--f-mono)}
.step.s-done .n{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.step.cur{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--ink)}
.step .nm{font-weight:600;font-size:.92rem}
.step .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;color:var(--mid);font-size:.8rem;margin-top:2px}
.step.s-not .nm{color:var(--mid);font-weight:500}
.donesum{border-top:0}
.donesum summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px}
.donesum summary::-webkit-details-marker{display:none}
.donesum summary .n{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-size:.8rem}
.donesum summary .nm{font-weight:600;font-size:.92rem}
.donesum[open] summary{border-bottom:1px solid var(--line)}
.donesum .step:first-child{border-top:0}
@media (max-width:520px){.step{grid-template-columns:28px minmax(0,1fr)}.step .pill{grid-column:2;justify-self:start}.donesum summary{grid-template-columns:28px minmax(0,1fr)}.donesum summary .pill{grid-column:2;justify-self:start}}

/* tables -> cards on phone */
.tblwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.act{text-align:right;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mid)}
@media (max-width:720px){
  .tblwrap{border:0;background:transparent;overflow:visible}
  table.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:10px}
  .tbl td{border:0;padding:4px 0;display:grid;grid-template-columns:minmax(96px,38%) minmax(0,1fr);gap:10px;align-items:center}
  .tbl td::before{content:attr(data-l);font-size:.72rem;color:var(--mid);text-transform:uppercase;letter-spacing:.05em}
  .tbl td.first{font-weight:600;display:block}
  .tbl td.first::before{display:none}
  .tbl td.act{display:block;text-align:left;padding-top:8px}
  .tbl td.act::before{display:none}
  .tbl td.act .btn{width:100%}
}

/* list rows (phone style) */
.list{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:.93rem;font-weight:600}
.li .tx span{display:block;color:var(--mid);font-size:.82rem}
.li svg.chev{width:18px;height:18px;color:var(--faint);flex:none}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 12px;font-size:.88rem;color:var(--mid);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > label,.fld > .flab,fieldset legend{font-size:.85rem;font-weight:600}
.fld .hint{font-size:.78rem;color:var(--mid)}
.fld .err{font-size:.8rem;color:var(--ink);font-weight:600}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{
  font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.invalid input,.invalid select,.invalid textarea{border:2px solid var(--ink)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--ink);flex:none}
.opt span b{display:block;font-weight:500;font-size:.92rem}
.opt span small{display:block;color:var(--mid);font-size:.8rem}
.opts-row{display:flex;gap:8px;flex-wrap:wrap}
.opts-row .opt{flex:1 1 130px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.chk input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.ev{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.ev .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:.75rem;font-weight:700}
.ev.ok .mk{background:var(--ink);color:var(--surface)}
.ev.no .mk{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:.8rem;font-weight:600;cursor:pointer;padding:6px}
.rules{display:flex;flex-direction:column;gap:3px;font-size:.8rem}
.rules span{color:var(--mid)} .rules span.ok{color:var(--ink);font-weight:600}
.codebox{display:flex;gap:8px}
.codebox input{text-align:center;font-family:var(--f-mono);font-size:1.2rem;padding:8px 0;width:100%;min-width:0}
.toggle{position:relative;width:48px;height:28px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;margin:0;cursor:pointer;position:relative;z-index:1}
.toggle span{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.toggle input:checked + span{background:var(--ink)}
.toggle input:checked + span::after{transform:translateX(20px)}

/* menus, dialogs, toast */
.mwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.18);min-width:280px;max-width:min(340px,calc(100vw - 32px));padding:6px;display:flex;flex-direction:column}
.menu .mi{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between}
.menu .mi:hover{background:var(--surface-2)}
.menu .mh{padding:10px 12px 6px}
.menu .note{padding:10px 12px;border-radius:6px;display:flex;flex-direction:column;gap:2px;font-size:.86rem;border:0;background:transparent;text-align:left;cursor:pointer}
.menu .note:hover{background:var(--surface-2)}
.menu .note span{color:var(--mid);font-size:.78rem}
.modal{position:fixed;inset:0;z-index:80;background:var(--scrim);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:14px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
@media (max-width:600px){.modal{place-items:end stretch;padding:0}.dlg{border-radius:16px 16px 0 0;width:100%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--on-ink);border-radius:10px;padding:12px 14px 12px 16px;display:flex;gap:14px;align-items:center;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);width:max-content}
.toast button{background:transparent;border:0;color:var(--on-ink);font-weight:700;text-decoration:underline;cursor:pointer;padding:4px}
@media (max-width:859px){.toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
.drawer{position:fixed;inset:0;z-index:85;background:var(--scrim);display:flex;justify-content:flex-end}
.drawer .panel{background:var(--surface);width:min(420px,100%);height:100%;overflow:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px 20px;display:flex;flex-direction:column;gap:14px}
.ch{border-top:1px solid var(--line);padding-top:12px}
.ch h3{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.ch h3 b{font-family:var(--f-mono);font-weight:500;font-size:.8rem;color:var(--mid)}
.ch button{display:flex;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:.86rem}
.ch button:hover{background:var(--surface-2)}
.ch button b{font-family:var(--f-mono);font-weight:500;font-size:.78rem;color:var(--mid);min-width:40px}
.ch button[aria-current="true"]{background:var(--surface-2);font-weight:600}
.storynext{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px;margin-top:8px;font-size:.84rem;color:var(--mid)}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:6px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* standalone views: website, auth, email, device */
.site{background:var(--surface)}
.site-h{display:flex;align-items:center;gap:14px;padding-block:16px;border-bottom:1px solid var(--line);max-width:1180px;margin:0 auto}
.site-h .logo{font-family:var(--f-head);font-weight:700;font-size:1.25rem;flex:1}
.site-h nav{display:flex;gap:18px;font-size:.9rem}
.site-h nav a{text-decoration:none;color:var(--mid)}
@media (max-width:720px){.site-h nav{display:none}}
.hero{max-width:1180px;margin:0 auto;padding-block:56px 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:600;letter-spacing:-.02em}
.hero p.lead{font-size:1.08rem;color:var(--mid);margin-top:16px;max-width:52ch}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);padding-block:32px}}
.sect{max-width:1180px;margin:0 auto;padding-block:36px;border-top:1px solid var(--line)}
.steps8{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-top:18px}
.steps8 div{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--bg)}
.steps8 b{font-family:var(--f-mono);font-weight:500;font-size:.8rem;color:var(--mid)}
.auth{min-height:calc(100vh - 52px);display:grid;place-items:center;padding-block:32px}
.authcard{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:18px}
@media (max-width:480px){.authcard{border:0;background:transparent;padding:4px 0}}
.authcard .logo{font-family:var(--f-head);font-weight:700;font-size:1.15rem}
.mail{max-width:680px;margin:28px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail .mh2{padding:16px 20px;border-bottom:1px solid var(--line);font-size:.86rem;display:grid;gap:3px}
.mail .mb{padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.devwrap{padding-block:24px 48px;display:flex;flex-direction:column;align-items:center;gap:16px}
.device{width:min(380px,100%);min-height:min(720px,calc(100vh - 140px));border-radius:36px;border:10px solid #0D0D0D;background:#0D0D0D;overflow:hidden;display:flex;flex-direction:column;position:relative}
.lock{flex:1;background:linear-gradient(170deg,#3A3A3A,#141414 70%);color:#F3F3F3;padding:56px 16px 24px;display:flex;flex-direction:column;align-items:center;gap:6px}
.lock .clock{font-family:var(--f-head);font-size:4rem;font-weight:500;line-height:1}
.notif{width:100%;background:rgba(255,255,255,.92);color:#1A1A1A;border-radius:16px;padding:12px 14px;text-align:left;border:0;cursor:pointer;margin-top:36px;display:flex;flex-direction:column;gap:2px;font:inherit}
.notif .nh{display:flex;gap:8px;align-items:center;font-size:.75rem;color:#5C5C5C}
.notif .nh i{width:18px;height:18px;border-radius:5px;background:#1A1A1A}
.notif .nh span{flex:1}
.sms{flex:1;background:#F3F3F3;color:#1A1A1A;display:flex;flex-direction:column}
.sms .sh{background:#fff;padding:14px 14px 10px;text-align:center;border-bottom:1px solid #DEDEDE;font-size:.85rem}
.sms .sh b{display:block;font-size:.95rem}
.sms .sb{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.bub{max-width:82%;padding:9px 12px;border-radius:16px;font-size:.9rem;line-height:1.4;background:#fff;align-self:flex-start;border:1px solid #DEDEDE}
.bub.me{align-self:flex-end;background:#1A1A1A;color:#fff;border-color:#1A1A1A}
.bub small{display:block;font-size:.68rem;opacity:.65;margin-top:3px}
.sms .sf{background:#fff;border-top:1px solid #DEDEDE;padding:10px;display:flex;gap:8px}
.sms .sf input{flex:1;border-radius:20px;border:1px solid #DEDEDE;padding:8px 14px;min-height:40px;background:#fff;color:#1A1A1A;width:auto;min-width:0}
.sms .sf button{border-radius:20px;border:0;background:#1A1A1A;color:#fff;padding:0 16px;font-weight:600;cursor:pointer}
.quick{display:flex;gap:8px;padding:0 10px 10px;background:#fff}
.quick button{flex:1;border:1px solid #1A1A1A;background:#fff;color:#1A1A1A;border-radius:18px;padding:8px;font-weight:600;cursor:pointer}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(520px,88%);border-radius:12px;padding:10px 14px;background:var(--surface-2)}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--on-ink)}
.msg small{display:block;font-size:.72rem;opacity:.7;margin-bottom:2px}
.viewer{background:#0D0D0D;border-radius:var(--r);aspect-ratio:4/5;max-width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.viewer canvas{width:100%;height:100%}
.viewer .vt{position:absolute;left:10px;top:10px;color:#CFCFCF;font:500 .72rem var(--f-mono)}
.viewer .vc{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.viewer .vc button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:5px 9px;cursor:pointer;font-size:.8rem}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,38%) minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:.85rem;border:0;background:transparent;padding:4px;border-radius:6px;text-align:left;cursor:pointer;width:100%}
.bar:hover{background:var(--surface-2)}
.bar .tr{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--mid);border-radius:4px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
.hist{display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.hist div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px}
.hist b{font-family:var(--f-mono);font-weight:500;font-size:.8rem}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
/* ================= TBFlow Design System layer =================
   Tokens copied from the TBFlow design system (tokens.json). Teal carries every action,
   orange is the brand voice only, loop statuses own the remaining colours.
   Layout: sticky prototype bar; desktop sidebar (logo, search, nav, What's new, account) + top bar;
   phone: top bar + bottom bar. Hero areas sit on a frame grid with plus marks. */
:root{
  --canvas:#F8FAFB; --surface:#FFFFFF; --surface-sunken:#F0F4F5; --border-frame:#E1E8EB; --border-subtle:#E1E8EB; --border-control:#687B85;
  --ink:#152830; --ink-secondary:#344953; --ink-muted:#4B606B; --ink-faint:#687B85;
  --primary:#0B706D; --primary-hover:#115955; --primary-tint:#E9FAF8; --primary-tint-strong:#CEF5EF; --on-primary:#FFFFFF; --focus:#078B85;
  --accent:#FF6E00; --accent-ink:#B84C00; --accent-tint:#FFF4EB;
  --done:#347400; --done-tint:#F3FBEA; --due:#B54708; --due-tint:#FFFAEB; --over:#B42318; --over-tint:#FEF3F2;
  --block:#344953; --block-tint:#E1E8EB; --wait:#075780; --wait-tint:#EFF8FF; --not:#4B606B; --not-tint:#F0F4F5;
  --danger:#D92D20; --danger-tint:#FEF3F2; --on-danger:#FFFFFF; --tooltip:#243640; --on-tooltip:#FFFFFF;
  --data-1:#06A99F; --data-2:#FF8A33; --data-track:#F0F4F5;
  --shadow-card:0 1px 2px rgba(21,40,48,.04); --shadow-raised:0 12px 32px -12px rgba(21,40,48,.14),0 1px 3px rgba(21,40,48,.06);
  --shadow-pop:0 20px 48px -16px rgba(21,40,48,.24),0 2px 6px rgba(21,40,48,.06); --shadow-segment:0 1px 2px rgba(21,40,48,.10),0 0 0 1px rgba(21,40,48,.04);
  --shadow-button:inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(11,112,109,.35);
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:20px;
  /* the prototype's older names, mapped onto the system */
  --bg:var(--canvas); --surface-2:var(--surface-sunken); --line:var(--border-subtle); --mid:var(--ink-muted); --faint:var(--ink-faint); --on-ink:var(--on-primary);
  --done-bg:var(--done-tint); --due-bg:var(--due-tint); --over-bg:var(--over-tint); --block-bg:var(--block-tint); --wait-bg:var(--wait-tint); --not-bg:var(--not-tint);
  --scrim:rgba(13,28,35,.45); --proto:#0D1C23; --on-proto:#E1E8EB;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-head:var(--f-body); --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --r-s:10px;
}

body{background:var(--canvas);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1{font-size:1.4rem;font-weight:700;letter-spacing:-.015em} h2{font-size:1.125rem;font-weight:700;letter-spacing:-.01em} h3{font-size:1rem;font-weight:600}
.label{font-size:.6875rem;letter-spacing:.08em;color:var(--ink-muted)}
.muted{color:var(--ink-muted)} .faint{color:var(--ink-faint)}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--canvas),0 0 0 4px var(--focus)}
a{color:var(--primary)}
.mono{font-family:var(--f-mono)}

/* ---------- prototype bar ---------- */
.pbar{border-bottom:1px solid rgba(255,255,255,.06)}
.pbrand{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:1rem;letter-spacing:-.03em;white-space:nowrap}
.pmark{width:26px;height:26px;border-radius:7px;background:#FFFFFF;display:grid;place-items:center;flex:none}
.pmark img{width:20px;height:20px;object-fit:contain}
.pbtn,.pbar select{border-radius:10px;border-color:rgba(225,232,235,.2)}

/* ---------- shell: sidebar ---------- */
.app{grid-template-columns:264px minmax(0,1fr)}
.side{background:var(--canvas);padding:0;gap:0}
.side-brand{height:64px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--border-subtle)}
.logo-img{height:38px;width:auto;display:block}
.side-search{display:flex;align-items:center;gap:10px;margin:12px;height:44px;padding:0 10px 0 12px;border-radius:var(--radius-md);background:var(--surface-sunken);border:0;color:var(--ink-secondary);font:500 15px/1 var(--f-body);cursor:pointer;text-align:left}
.side-search svg{width:18px;height:18px}
.side-search span{flex:1}
.side-search kbd{font:500 12px/1 var(--f-mono);color:var(--ink-muted);background:var(--surface);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:4px 6px}
.side-nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav-i{height:44px;padding:0 12px;border-radius:var(--radius-md);color:var(--ink-secondary);font-weight:500;gap:12px;transition:background .15s ease-out}
.nav-i svg{color:var(--ink-muted)}
.nav-i:hover{background:var(--surface-sunken);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--primary-tint);color:var(--primary-hover);font-weight:600}
.nav-i[aria-current="page"] svg{color:var(--primary)}
.side-foot{margin-top:auto;display:flex;flex-direction:column}
.promo{margin:12px;padding:14px 16px;border-radius:12px;background:var(--accent-tint);border:1px solid var(--border-frame);display:grid;grid-template-columns:20px 1fr;gap:2px 12px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.promo svg{width:18px;height:18px;color:var(--accent-ink);grid-row:span 2;margin-top:3px}
.promo b{font-weight:600;font-size:.95rem}
.promo b span{color:var(--accent-ink);font-weight:500}
.promo .pt{font-size:.85rem;line-height:1.4;color:var(--ink-secondary)}
.acct{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--border-subtle)}
.acct .avatar{width:34px;height:34px;font-size:.75rem}
.acct b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct > div > span{display:block;font-size:.8rem;color:var(--ink-muted)}
.demo-note{margin:0;padding:0 16px 14px;font-size:.72rem;color:var(--ink-faint)}

/* ---------- top bar ---------- */
.topbar{background:var(--canvas);border-bottom:1px solid var(--border-subtle);min-height:64px;padding-block:10px;gap:8px}
.topbar h1{font-size:1.375rem}
.topbar .t p{color:var(--ink-muted)}
.iconbtn{border:0;background:var(--surface-sunken);border-radius:var(--radius-md);color:var(--ink-secondary)}
.iconbtn:hover{background:var(--border-subtle);color:var(--ink)}
.iconbtn .dot{top:8px;right:9px;width:8px;height:8px;background:var(--accent);border:0;box-shadow:0 0 0 2px var(--surface-sunken)}
.iconbtn.sm{width:32px;height:32px;background:transparent}
.iconbtn.sm svg{width:16px;height:16px}
.avatar{background:var(--primary-tint);color:var(--primary-hover);font-weight:700}
.switch{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 12px 0 8px;border-radius:var(--radius-md);background:var(--surface-sunken);border:0;font:600 14px/1 var(--f-body);color:var(--ink);cursor:pointer;max-width:260px}
.switch .sq{width:24px;height:24px;border-radius:var(--radius-sm);background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none}
.switch .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-chev{width:7px;height:7px;border-right:1.75px solid var(--ink-muted);border-bottom:1.75px solid var(--ink-muted);transform:translateY(-2px) rotate(45deg);flex:none;margin-left:2px}
.sync{color:var(--ink-muted)}
.sync i{background:var(--done)}
.sync.off i{background:var(--due)}
@media (max-width:1100px){.switch .fn,.help-b{display:none}.switch{padding:0 8px}}
@media (max-width:859px){
  .topbar{background:var(--canvas)}
  .fac-w{display:none}
  .bnav{background:var(--surface);box-shadow:0 -4px 16px rgba(21,40,48,.05)}
  .bnav button[aria-current="page"]{color:var(--primary-hover)}
  .bnav button svg{padding:3px 14px;width:52px;height:28px;box-sizing:border-box;border-radius:999px}
  .bnav button[aria-current="page"] svg{background:var(--primary-tint);color:var(--primary)}
}
.content{gap:20px;padding-block:24px 48px}

/* ---------- buttons (soft rectangles) ---------- */
.btn{border-radius:var(--radius-md);font-weight:600;min-height:44px;padding:10px 18px;transition:background .15s ease-out,box-shadow .15s ease-out}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-button)}
.btn-primary:hover{background:var(--primary-hover);opacity:1}
.btn-secondary{background:var(--surface);color:var(--ink);border:1px solid var(--border-subtle);box-shadow:var(--shadow-card)}
.btn-secondary:hover{background:var(--surface-sunken)}
.btn-quiet{background:var(--surface-sunken);color:var(--ink)}
.btn-quiet:hover{background:var(--border-subtle)}
.btn-link{color:var(--primary);text-decoration:none;font-weight:600}
.btn-link:hover{text-decoration:underline;text-underline-offset:3px}
.btn-danger{background:var(--surface);color:var(--danger);border:1px solid var(--danger)}
.btn-danger:hover{background:var(--danger-tint)}
.btn[disabled]{background:var(--surface-sunken);color:var(--ink-faint);border-color:transparent;box-shadow:none;opacity:1}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.875rem}

/* ---------- surfaces ---------- */
.card{border-radius:var(--radius-lg);border-color:var(--border-subtle);box-shadow:var(--shadow-card);padding:20px;gap:14px}
@media (min-width:860px){.card{padding:24px}}
.stats{gap:16px}
.stat{border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:18px 20px;border-color:var(--border-subtle)}
.stat > span:first-child{font-size:.875rem;font-weight:600;color:var(--ink-secondary)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:2rem;letter-spacing:-.02em;margin:2px 0}
.stat span:last-child{font-size:.8rem;color:var(--ink-muted)}
.pcard{border-radius:12px;background:var(--canvas);border-color:var(--border-subtle)}
.kv dt{color:var(--ink-muted)}
.divider{background:var(--border-frame)}

/* ---------- status pills ---------- */
.pill{height:24px;padding:0 10px 0 8px;font-weight:600;font-size:.75rem;box-shadow:none;outline:none}
.pill i{width:7px;height:7px}
.p-done{color:var(--done);background:var(--done-tint)} .p-due{color:var(--due);background:var(--due-tint)} .p-over{color:var(--over);background:var(--over-tint)}
.p-block{color:var(--block);background:var(--block-tint);box-shadow:inset 0 0 0 1.5px currentColor}
.p-wait{color:var(--wait);background:var(--wait-tint);outline:1.5px dashed currentColor;outline-offset:-1.5px}
.p-not{color:var(--not);background:var(--not-tint)}
.p-not i{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.chip{border-radius:var(--radius-sm);background:var(--surface-sunken);border-color:transparent;color:var(--ink-secondary);font-weight:500}
.owner i{background:var(--primary-tint);border:0;color:var(--primary-hover)}

/* ---------- banners: tint + icon disc ---------- */
.banner{position:relative;border-radius:var(--radius-lg);border:0;padding:14px 16px 14px 56px;background:var(--primary-tint);color:var(--primary);box-shadow:none;outline:none}
.banner::before{content:"";position:absolute;left:16px;top:14px;width:28px;height:28px;border-radius:999px;background:var(--surface)}
